<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Darkstore Twin</title>
  </head>
  <body>
    <canvas id="c"></canvas>
    <header>
      <div class="brand">DARKSTORE <em>TWIN</em></div>
      <div class="views">
        <button data-view="overview">Overview</button>
        <button data-view="top">Plan</button>
        <button data-view="aisle">Aisle</button>
        <button data-view="chiller">Chiller</button>
        <button data-view="hv">HV cage</button>
        <button data-view="ph">Pigeon holes</button>
        <span class="sep"></span>
        <button id="walls" class="on" title="Toggle wall height">Walls</button>
        <button id="labels" class="on" title="Toggle barcode labels">Labels</button>
      </div>
    </header>
    <aside id="left">
      <div id="summary"></div>
      <label class="find">
        <span>Find bin, pigeon hole, pallet or product</span>
        <input id="search" placeholder="A5-06-C3 · PH-B07 · Amul Butter" autocomplete="off" />
      </label>
      <div id="miss" hidden>No match</div>
      <div class="hint">Click a bin to inspect · double-click to fly to it · drag to orbit · right-drag to pan</div>
    </aside>
    <aside id="inspector" hidden></aside>
    <div id="tip" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
