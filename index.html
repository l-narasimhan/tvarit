<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Darkstore Twin</title>
  </head>
  <body>
    <canvas id="c"></canvas>
    <header>
      <div class="brand">DARKSTORE <em>TWIN</em></div>
      <div class="views">
        <button data-view="overview">Overview</button>
        <button data-view="top">Plan</button>
        <button data-view="aisle">Aisle</button>
        <button data-view="chiller">Chiller</button>
        <button data-view="hv">HV cage</button>
        <button data-view="ph">Pigeon holes</button>
        <button data-view="tv">Pendency TV</button>
        <span class="sep"></span>
        <span class="simctl"><b id="simclock">--:--:--</b>
          <button data-speed="0" title="Pause">⏸</button><button data-speed="1" class="on">1×</button><button data-speed="5">5×</button><button data-speed="20">20×</button><button data-speed="60">60×</button></span>
        <button id="neworder" class="go" title="Trace one live order end to end">▶ Follow an order</button>
        <button id="walk" title="First-person walk (V)">🚶 Walk</button>
        <button id="walls" class="on" title="Toggle wall height">Walls</button>
        <button id="labels" class="on" title="Toggle barcode labels">Labels</button>
        <button id="tags" class="on" title="Name tags on people">Tags</button>
        <button id="sound" class="on" title="Chiller sound">🔊 Sound</button>
      </div>
    </header>
    <aside id="left">
      <div id="summary"></div>
      <div id="kpis"></div>
      <div id="staff"></div>
      <label class="find">
        <span>Find bin, pigeon hole, pallet or product</span>
        <input id="search" placeholder="A5-06-C3 · PH-B07 · Amul Butter" autocomplete="off" />
      </label>
      <div id="miss" hidden>No match</div>
      <div class="hint">Click a bin or a person to inspect · double-click to fly to it · drag to orbit · right-drag to pan</div>
    </aside>
    <aside id="inspector" hidden></aside>
    <div id="tip" hidden></div>
    <div id="chip" hidden></div>
    <aside id="order" hidden>
      <div class="obar">
        <span>Live order</span>
        <button id="follow" class="on" title="Camera follows whoever is working the order">Follow</button>
        <button id="closeorder" aria-label="Close">×</button>
      </div>
      <div class="body"></div>
    </aside>
    <div id="hud" hidden>
      <div class="cross"></div>
      <div id="aim" hidden></div>
      <div class="help"><b>Click</b> to look around · <b>↑↓</b> move · <b>←→</b> turn · <b>A D</b> sidestep · <b>Shift</b> hurry · <b>Click</b> a bin to scan it · <b>Esc</b> free mouse · <b>V</b> leave walk</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
